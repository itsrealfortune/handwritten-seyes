<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Feuille Seyès - écriture multi-polices</title>
<link rel="stylesheet" href="css/styles.css">
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toolbar">
  <div class="field">
    <label for="inkColor">Couleur d'encre</label>
    <input type="color" id="inkColor" value="#1b3a6b">
  </div>
  <div class="field">
    <label for="fontSize">Taille : <span id="fontSizeVal">0.55</span>cm</label>
    <input type="range" id="fontSize" min="0.35" max="0.75" step="0.01" value="0.55">
  </div>
  <div class="field">
    <label for="alignMain">Position du texte (zone principale)</label>
    <select id="alignMain">
      <option value="left">Contre la ligne (à gauche de la zone)</option>
      <option value="right">Contre le bord droit de la page</option>
      <option value="center">Centré dans la zone</option>
      <option value="justify">Justifié (remplit toute la largeur)</option>
    </select>
  </div>
  <div class="field">
    <label for="vNudge">Ajustement vertical fin : <span id="vNudgeVal">2.5</span>mm</label>
    <input type="range" id="vNudge" min="-4" max="4" step="0.5" value="2.5">
  </div>
  <div class="field">
    <label for="letterSpacing">Espacement lettres : <span id="letterSpacingVal">0</span>px</label>
    <input type="range" id="letterSpacing" min="-2" max="5" step="0.1" value="0">
  </div>
  <div class="field">
    <label for="lineH">Interligne : <span id="lineHVal">0.767</span>cm</label>
    <input type="range" id="lineH" min="0.6" max="1.2" step="0.001" value="0.767">
  </div>
  <div class="field">
    <label for="printSeyes"><input type="checkbox" id="printSeyes"> Imprimer le Seyes (sinon feuille Seyes pre-imprimee)</label>
  </div>
  <div class="field">
    <label for="boldExport"><input type="checkbox" id="boldExport"> Export en gras</label>
  </div>
  <button id="saveBtn">💾 Enregistrer</button>
  <input type="file" id="loadInput" accept=".json" style="display:none">
  <button class="secondary" id="loadBtn">📂 Charger</button>
  <button class="secondary" id="demoBtn">🎬 Démo</button>
  <button class="secondary" id="clearBtn">🗑 Effacer</button>
  <button id="screenshotBtn">Exporter en PDF</button>
  <button id="printBtn" style="display:none">Imprimer / PDF</button>
</div>

<div class="body-layout">
  <button id="fontToggle" class="font-toggle" title="Polices">></button>
  <div class="fontpool" id="fontPool">
    <h2>Polices utilisées (tirage au hasard, lettre par lettre)</h2>
    <div class="actions">
      <button id="selAll">Tout cocher</button>
      <button id="selNone">Tout décocher</button>
    </div>
    <div id="fontList"></div>
  </div>

  <div id="pagesContainer" class="pages-container">
  <div class="page">
    <div class="zone-stage margin" id="stageMargin">
      <div class="zone-display" id="displayMargin"></div>
      <textarea class="zone-input" id="inputMargin" spellcheck="false"></textarea>
    </div>
    <div class="zone-stage main" id="stageMain">
      <div class="zone-display" id="displayMain"></div>
      <div class="zone-placeholder" id="placeholderMain">Écrivez ici, chaque nouvelle lettre prend une police au hasard…</div>
      <textarea class="zone-input" id="inputMain" spellcheck="false"></textarea>
    </div>
    <div id="virtualCursor" class="virtual-cursor"></div>
  </div>
  </div>
</div>

<div class="status" id="status"></div>

<script src="js/app.js"></script>

</body>
</html>
